<div class="main-container event">
  <app-event-banner
    url="events/bitcup/bitcup.png"
    alt="Logo Bitcup"
  >
  </app-event-banner>

  <app-event-title [dates]="event?.dates" [spectatorInscriptionEnabled]="event?.spectatorInscriptionEnabled">
    {{ 'HOME.BITCUP.TITLE' | translate }}
  </app-event-title>

  <!-- INSCRIPTION section -->
  <app-event-inscription-section [dates]="event?.dates" [inscriptionLink]="event?.inscriptionLink" [spectatorInscriptionEnabled]="event?.spectatorInscriptionEnabled" [spectatorInscriptionLink]="event?.spectatorInscriptionLink" />

  <ul class="bitcup-cards-grid">
    <app-event-content-card
      title="{{ 'BITCUP.DESCRIPTION' | translate }}"
      imageUrl="../../../../../assets/image/events/bitcup/description.png">
      <p content>{{ 'BITCUP.DESCRIPTION-TEXT' | translate }}</p>
    </app-event-content-card>

    <app-event-content-card
      title="{{ 'BITCUP.FORMAT' | translate }}"
      imageUrl="../../../../../assets/image/events/bitcup/format.png">
      <p content>{{ 'BITCUP.FORMAT-TEXT' | translate }}</p>
    </app-event-content-card>

    <app-event-content-card
      title="{{ 'BITCUP.LEVEL' | translate }}"
      imageUrl="../../../../../assets/image/events/bitcup/level.png">
      <p content>{{ 'BITCUP.LEVEL-TEXT' | translate }}</p>
    </app-event-content-card>
  </ul>


  <app-event-date-section [dates]="event?.dates" [spectatorInscriptionEnabled]="event?.spectatorInscriptionEnabled" />

  <!-- Sponsors -->
  <app-event-section title="{{ 'IEEEXTREME.SPONSORSHIP.TITLE' | translate }}">
    <app-sponsor-component [currentsponsor]="sponsorsServiceVar.getCurrentSponsors()"></app-sponsor-component>
  </app-event-section>

  <!-- Editor de evento -->
  <app-event-editor-button *ngIf="!!event" [event]="event" (updateEmitter)="updateEvent($event)"></app-event-editor-button>
</div>

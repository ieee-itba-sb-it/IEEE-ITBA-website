<div class="main-container event">
  <app-event-facts-banner
    imageUrl="../../../../../assets/image/events/ieeextreme/XtremeLogo.png"
    imageAlt="Logo IEEEXtreme"
    [facts]="facts"
  ></app-event-facts-banner>

  <app-event-title [dates]="event?.dates" [spectatorInscriptionEnabled]="event?.spectatorInscriptionEnabled">
    {{ 'HOME.IEEEXTREME.TITLE' | translate }}
  </app-event-title>

  <div>
        <app-ranking-page-button [rankingPath]="'/ieeextreme-ranking'" />
  </div>

  <!-- INSCRIPTION section -->
  <app-event-inscription-section [dates]="event?.dates" [inscriptionLink]="event?.inscriptionLink" [spectatorInscriptionEnabled]="event?.spectatorInscriptionEnabled" [spectatorInscriptionLink]="event?.spectatorInscriptionLink" />

  <ul class="ieeextreme-cards-grid">
    <app-event-content-card
      title="{{ 'IEEEXTREME.TEAM.TITLE' | translate }}"
      imageUrl="../../../../../assets/image/events/ieeextreme/tackle-problems-as-a-team.png">
      <p content>{{ 'IEEEXTREME.TEAM.TEXT' | translate }}</p>
    </app-event-content-card>

    <app-event-content-card
      title="{{ 'IEEEXTREME.PARTICIPATE.TITLE' | translate }}"
      imageUrl="../../../../../assets/image/events/ieeextreme/want-to-participate.png">
      <p content>{{ 'IEEEXTREME.PARTICIPATE.TEXT' | translate }}</p>
    </app-event-content-card>

    <app-event-content-card
      title="{{ 'IOT.GALLERY_TITLE' | translate }}"
      [image]="false">
      <app-image-carousel content [imageLinks]="imageLinks"/>
    </app-event-content-card>
  </ul>

  <div class="d-flex justify-content-center align-content-center">
      <h1>{{ 'IEEEXTREME.MORE_INFO' | translate }} <a href="https://ieeextreme.org/">{{ 'IEEEXTREME.CLICK_ME' | translate}}</a></h1>
  </div>

  <app-event-date-section [dates]="event?.dates" [spectatorInscriptionEnabled]="event?.spectatorInscriptionEnabled" />

  <!-- Sponsors -->
  <app-event-section title="{{ 'IEEEXTREME.SPONSORSHIP.TITLE' | translate }}">
    <app-sponsor-component style="display: flex; justify-content: center"
                           [currentsponsor]="sponsorsServiceVar.getIeextremeSponsors()"></app-sponsor-component>
  </app-event-section>

  <!-- Sponsor team -->

<!--      title="{{contact.name }}"-->

<!--    >-->
<!--      <a content class="card-content" href="mailto:{{contact.mail}}">-->
<!--        {{contact.mail}}-->
<!--      </a>-->
<!--    </app-event-content-card>-->
<!--    </div>-->
<!--  </app-event-section>-->

    <!-- Editor de evento -->
    <app-event-editor-button *ngIf="!!event" [event]="event" (updateEmitter)="updateEvent($event)"></app-event-editor-button>
</div>

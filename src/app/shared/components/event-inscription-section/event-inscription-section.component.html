<ng-container *ngIf="showEnrollSection() || showExamsButton()">
    <app-event-section title="{{ (showEnrollSection() ? 'HOME.EVENTS.ENROLL.OPEN' : 'HOME.EVENTS.EXAMS.OPEN') | translate }}" [asimov]="isAsimov">
        <div class="inscription-button-container" [class.inscription-button-container-dual]="showInscriptionButton() && showSpectatorInscriptionButton()">
            <button *ngIf="showInscriptionButton()" class="btn inscription-button w-25" [style.--color]="(getAppColors() | async).background" (click)="onInscriptionClick()">
                <span>{{ hasSpectatorInscription() ? ('HOME.EVENTS.ENROLL.CLICK_COMPETE' | translate) : ('HOME.EVENTS.ENROLL.CLICK' | translate) }}</span>
            </button>
            <button *ngIf="showSpectatorInscriptionButton()" class="btn inscription-button spectator-inscription-button w-25" [style.--color]="(getAppColors() | async).background" (click)="onSpectatorInscriptionClick()">
                <span>{{ 'HOME.EVENTS.ENROLL.CLICK_SPECTATE' | translate }}</span>
            </button>
            <button *ngIf="showExamsButton()" class="btn inscription-button w-25" [style.--color]="(getAppColors() | async).background" [routerLink]="examsRoute">
                <span>{{ 'HOME.EVENTS.EXAMS.CLICK' | translate }}</span>
            </button>
        </div>
    </app-event-section>
</ng-container>

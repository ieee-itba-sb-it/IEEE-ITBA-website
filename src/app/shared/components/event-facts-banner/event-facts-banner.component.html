<div class="facts-banner">
    <img src="{{imageUrl}}" alt="{{imageAlt}}" class="banner-image">
    <div class="container" *ngIf="facts">
      <div class="facts-container">
        <div class="col-sm" *ngFor="let fact of facts">
          <h1>{{ fact.value }}</h1>
          <h3 class="facts">{{ fact.label | translate }}</h3>
        </div>
      </div>
    </div>
</div>

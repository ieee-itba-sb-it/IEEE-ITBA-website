<swiper [config]="swiperConfig" class="carousel-wrapper" *ngIf="imageLinks?.length">
    <ng-template swiperSlide *ngFor="let image of imageLinks">
      <div class="slide">
        <img [attr.data-src]="image" class="img swiper-lazy" alt="" />
        <div class="swiper-lazy-preloader"></div>
      </div>
    </ng-template>
</swiper>
